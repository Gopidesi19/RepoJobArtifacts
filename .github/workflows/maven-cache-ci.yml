name: Maven CI with Cache
on:
  push:
    branch:
      - main
  pull_request:
    branch:
      - main
jobs:
  maven-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'Temurin'
          cache: '~/.m2/repository'
          cache-dependency-path: 'pom.xml'
      - name: Install packages
        run: 'mvn clean package'

